services:
  redis:
    image: redis:7-alpine
    container_name: api-gateway-redis

    ports:
      - "6379:6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

    # Dados persistem mesmo se o container reiniciar
    volumes:
      - redis-data:/data

    restart: unless-stopped

volumes:
  redis-data: